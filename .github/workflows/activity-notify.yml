name: Hourly GitHub Activity Tracker

on:
  schedule:
    # Runs at minute 0 every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write # Needed to commit and push updated last_run.json

jobs:
  track-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Activity Tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python tracker.py

      - name: Commit and push state
        if: always() # Always save execution outcome (success or failed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.json
          git diff --staged --quiet || (git commit -m "chore: sync last_run.json state [skip ci]" && git push)
