name: Monitor All Public Repos

on:
  schedule:
    # Runs automatically every 30 minutes
    - cron: '*/30 * * * *'
  # Allows triggering the workflow manually via GitHub Actions UI
  workflow_dispatch:

# Required permissions to commit and push the updated state back to the repository
permissions:
  contents: write

jobs:
  track:
    name: Track Stars and Forks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tracker script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python tracker.py

      - name: Commit updated last_run state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.json
          # Commit and push only if state changes, skipping CI loops
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last check state [skip ci]" && git push)
