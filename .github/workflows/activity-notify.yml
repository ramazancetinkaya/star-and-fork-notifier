name: Public Activity Discord Notifier

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at minute 0 of every hour
  workflow_dispatch:      # Allows manual trigger for testing

concurrency:
  group: activity-tracker
  cancel-in-progress: false

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit last_run.json back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run Activity Tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python tracker.py

      - name: Persist State (last_run.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): update last_run.json [skip ci]"
            git push
          fi
